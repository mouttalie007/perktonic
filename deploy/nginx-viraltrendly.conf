# nginx vhost for ViralTrendly.com — a NEW, separate file. Never edit
# live.dimabac.com or default alongside this (see memory: viraltrendly-vps).
#
# IP-only phase (no domain/Cloudflare yet, per 2026-09-13 decision): plain
# HTTP, matched on the bare IP so it doesn't collide with dimabac's own
# vhost (which matches on live.dimabac.com) or the generic `default` site.
# When a domain is added later, replace `server_name` with the domain (+www
# redirect) and add TLS via `certbot --nginx` — see deploy/README.md.
#
# Install:
#   sudo cp deploy/nginx-viraltrendly.conf /etc/nginx/sites-available/viraltrendly
#   sudo ln -s /etc/nginx/sites-available/viraltrendly /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name 109.205.179.106;

    client_max_body_size 15m;

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3100;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
