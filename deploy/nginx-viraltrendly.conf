# nginx vhost for ViralTrendly.com — a NEW, separate file. Never edit
# live.dimabac.com or default alongside this (see memory: viraltrendly-vps).
#
# Install:
#   sudo cp deploy/nginx-viraltrendly.conf /etc/nginx/sites-available/viraltrendly.com
#   sudo ln -s /etc/nginx/sites-available/viraltrendly.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d viraltrendly.com -d www.viraltrendly.com
#     (certbot rewrites the 443 server block below in place, filling in
#     ssl_certificate/ssl_certificate_key and adding its own redirect —
#     that's expected, don't hand-maintain the cert paths yourself)
#
# DNS must already point viraltrendly.com + www at 109.205.179.106 before
# running certbot, or the HTTP-01 challenge fails.

# apex + www on 80 -> redirect to https apex (canonical, no www — matches
# NEXT_PUBLIC_SITE_URL). Also serves the ACME challenge before a cert exists.
server {
    listen 80;
    listen [::]:80;
    server_name viraltrendly.com www.viraltrendly.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://viraltrendly.com$request_uri;
    }
}

# www -> apex redirect, once a cert covering www exists too.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.viraltrendly.com;
    return 301 https://viraltrendly.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name viraltrendly.com;

    # certbot --nginx fills these in on first run.
    # ssl_certificate     /etc/letsencrypt/live/viraltrendly.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/viraltrendly.com/privkey.pem;

    # Admin image uploads go through sharp compression app-side, but leave
    # headroom for the pre-compression upload itself.
    client_max_body_size 15m;

    # Immutable hashed build assets — safe to cache hard at the edge too.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3100;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
