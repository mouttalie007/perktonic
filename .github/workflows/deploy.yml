name: Deploy to cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            source "$HOME/nodevenv/perktonic-app/22/bin/activate"
            cd "$HOME/perktonic-app"
            # Shared hosting has a disk quota: drop regenerable caches first so the pull/install/build can write.
            echo "--- disk before cleanup ---"; du -sh "$HOME" 2>/dev/null || true; quota -s 2>/dev/null || true
            rm -rf .next/cache "$HOME/.npm/_cacache" "$HOME/.npm/_logs" "$HOME/.cache" 2>/dev/null || true
            echo "--- biggest dirs ---"; du -sh .next node_modules public/uploads "$HOME/nodevenv" "$HOME/.git" .git 2>/dev/null || true
            git gc --prune=now -q 2>/dev/null || true
            git pull origin main
            # AUTH_SECRET encrypts the saved Claude API key; generate it once on the server (never in the repo).
            if ! grep -qE '^AUTH_SECRET="?[^"[:space:]]' .env; then
              sed -i '/^AUTH_SECRET=/d' .env
              echo >> .env
              echo "AUTH_SECRET=\"$(openssl rand -base64 32)\"" >> .env
              echo "AUTH_SECRET was missing: generated a new one"
            fi
            npm install
            npx prisma generate
            npx prisma migrate deploy
            npm run db:import-prompts
            npm run db:import-briefs || echo "article-brief import failed, continuing deploy"
            npx tsx prisma/backfill-og-variants.ts || echo "og-variant backfill failed, continuing deploy"
            npx tsx prisma/backfill-width-variants.ts || echo "width-variant backfill failed, continuing deploy"
            npm run build
            mkdir -p tmp
            touch tmp/restart.txt
