name: Deploy to cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            source "$HOME/nodevenv/perktonic-app/22/bin/activate"
            cd "$HOME/perktonic-app"
            git pull origin main
            npm install
            npx prisma generate
            npx prisma migrate deploy
            npm run db:import-prompts
            npx tsx prisma/backfill-og-variants.ts || echo "og-variant backfill failed, continuing deploy"
            npm run build
            mkdir -p tmp
            touch tmp/restart.txt
