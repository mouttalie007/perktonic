name: Deploy to VPS

# Manual only until the DNS cutover (then this becomes the main deploy and the
# cPanel one is switched to manual). Runs as the unprivileged `perktonic` user.
on:
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 20m
          script: |
            set -e
            export PATH="$HOME/node/bin:$PATH"
            cd "$HOME/app"
            git pull origin main
            npm ci --omit=dev --no-audit --no-fund --fetch-retries=6 --fetch-retry-mintimeout=3000 --maxsockets=4
            npx prisma generate
            npx prisma migrate deploy
            npm run db:import-prompts || echo "prompt import failed, continuing deploy"
            npx tsx prisma/seed-tool-categories.ts || echo "tool-category seed failed, continuing deploy"
            npm run db:import-briefs || echo "article-brief import failed, continuing deploy"
            npx tsx prisma/backfill-og-variants.ts || echo "og-variant backfill failed, continuing deploy"
            npx tsx prisma/backfill-width-variants.ts || echo "width-variant backfill failed, continuing deploy"
            NODE_OPTIONS=--max-old-space-size=2048 nice -n 19 npm run build
            sudo systemctl restart perktonic
            sleep 4
            curl -s -o /dev/null -w "local check: %{http_code}\n" -H "Host: perktonic.com" http://127.0.0.1:3100/
